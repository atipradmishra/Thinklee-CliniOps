# ── Minimal change to your existing nginx config ──────────────────────
#
# Your TLS and your :80 -> :443 redirect already work, so do NOT replace
# the whole file. Add these four directives inside the existing
#
#     server { listen 443 ssl; server_name cliniops.cloudhubs.nl; ... }
#
# block, alongside the other settings. That is the entire nginx change.

    # Uploads. nginx defaults to 1 MB, which is why a 2 MB POST to
    # /api/data/upload-file currently returns 413 before Flask sees it.
    client_max_body_size 100m;
    client_body_timeout  300s;

    # Embedding is synchronous: ~1.1 s per 1000-character chunk on CPU,
    # so ~56 s for a 10-page PDF and ~4 minutes for 40 pages.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
