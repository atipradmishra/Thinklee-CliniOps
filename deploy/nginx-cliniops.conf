# /etc/nginx/sites-available/cliniops
#
# Reference config for cliniops.cloudhubs.nl. Check the ssl_certificate paths
# against what you already have — if certbot issued your certs they will
# already be under /etc/letsencrypt/live/<domain>/ and you should keep
# certbot's own managed lines rather than replacing them.
#
# Two changes matter for the upload bug:
#
#   client_max_body_size   nginx defaults to 1 MB, so any real PDF is
#                          rejected with 413 before Flask ever sees it.
# Your existing :80 -> :443 redirect is already correct and is reproduced
# here unchanged. The only directive this server is actually missing is
# client_max_body_size — verified against the live host, which returns 413
# for a 2 MB upload.

# ── HTTP: redirect everything to HTTPS ────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name cliniops.cloudhubs.nl;

    # Leave this so certbot can still renew over http.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: the application ────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cliniops.cloudhubs.nl;

    ssl_certificate     /etc/letsencrypt/live/cliniops.cloudhubs.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cliniops.cloudhubs.nl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Document uploads. 1 MB is the nginx default and far too small here —
    # a 40-page PDF is comfortably over it. Raise Flask's MAX_CONTENT_LENGTH
    # to match if you ever set one.
    client_max_body_size 100m;
    client_body_timeout  300s;
    client_body_buffer_size 1m;

    # Embedding a document is slow and synchronous: roughly 1.1 s per 1000
    # character chunk on CPU, so ~56 s for 10 pages and ~4 minutes for 40.
    # These must exceed the gunicorn --timeout, not the other way round.
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;
    send_timeout          300s;

    # Security headers. CSP is omitted deliberately — the app loads Tailwind,
    # Chart.js, Font Awesome and Boxicons from CDNs, so a policy needs to be
    # written against that list rather than guessed at here.
    add_header X-Frame-Options            "SAMEORIGIN"        always;
    add_header X-Content-Type-Options     "nosniff"           always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security  "max-age=31536000"  always;

    access_log /var/log/nginx/cliniops.access.log;
    error_log  /var/log/nginx/cliniops.error.log;

    # Static files straight from disk — no need to wake the single worker.
    location /static/ {
        alias /home/ubuntu/Thinklee-CliniOps/app/static/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Uploads are streamed to the app rather than buffered to a temp file
        # first, so a slow ingest does not also pay a buffering delay.
        proxy_request_buffering off;
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_buffer_size 16k;
    }
}
